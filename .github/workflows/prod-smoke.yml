name: Weekly Prod Smoke

# 결정 18(2026-10-25): 주간 스모크는 template 으로 돌린다. full 은 prod-quality-full.yml(월 1회 수동).
# 판정 = HTTP·qualityContract.overall(blocked 면 실패)·주요 페이지. 상태 라벨(status.summary)로 판정하지 않는다.
# 내부 코드 노출 검사는 PR-14 가 들어가기 전까지 report(경고)가 기본이다. 수동 실행에서 enforce 로 바꿀 수 있다.

on:
  schedule:
    # 매주 일요일 22:00 UTC = 월요일 07:00 KST
    - cron: "0 22 * * 0"
  workflow_dispatch:
    inputs:
      leak_gate:
        description: "내부 코드 노출 검사 — report(경고만) / enforce(실패)"
        type: choice
        options: [report, enforce]
        default: report

permissions:
  contents: read

jobs:
  prod-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Template smoke (pages + /api/ask template)
        env:
          SMOKE_ASK_MODE: template
          SMOKE_LEAK_GATE: ${{ inputs.leak_gate || 'report' }}
          SMOKE_OUTPUT_DIR: smoke-output
        run: node scripts/prod_ask_smoke.mjs

      - name: Upload smoke output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prod-smoke-template-${{ github.run_id }}
          path: smoke-output/
          retention-days: 30
          if-no-files-found: warn

      - name: Deploy sanity — HSTS header check
        run: |
          set -e
          headers=$(curl -sSI --max-time 60 -A "Mozilla/5.0 Chrome/126" "https://www.safeclaw.kr/")
          echo "$headers"
          echo "$headers" | grep -qi '^strict-transport-security:' || {
            echo "Missing strict-transport-security header on https://www.safeclaw.kr/"
            exit 1
          }
