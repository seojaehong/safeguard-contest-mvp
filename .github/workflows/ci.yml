name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # package-lock.json은 .gitignore 대상이라 npm ci/cache 사용 불가
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      # Browser suites create isolated Next builds; serialize them to avoid
      # shared .next contention on the single GitHub runner.
      - run: npm test -- --maxWorkers=1 --fileParallelism=false
      - run: npm run build
