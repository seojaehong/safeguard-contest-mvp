name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Northstar evidence gates verify historical commit ancestry.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      # package-lock.json 은 커밋돼 있다 — lock 그대로 설치한다.
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      # 빌드를 시험보다 먼저 한다. .next/BUILD_ID 가 있어야 prod 모드 브라우저 시험이 돈다
      # (CI 에서는 빌드가 없으면 skip 하지 않고 실패한다).
      - run: npm run build
      # prod 빌드(.next)를 쓰는 묶음은 전체 시험보다 먼저 돌린다. 전체 시험 중 next dev 를 cwd 에서 띄우는
      # 묶음(reports-download-center)이 .next 를 dev 산출물로 덮어써 BUILD_ID 가 사라지기 때문이다.
      - run: npx vitest run tests/share-recipient-portal-browser.test.ts --maxWorkers=1 --fileParallelism=false
      # north-star 묶음은 skip 되던 동안 UI 와 어긋났다(낡은 단언 + 편집기 중첩 스크롤 결함, PR-20 에서 발견).
      # UI 를 고치는 후속 PR 전까지 돌리되 막지 않는다 — 실패하면 경고 annotation 으로 보인다.
      - name: North Star document UX (non-blocking until UI follow-up)
        continue-on-error: true
        run: |
          npx vitest run tests/north-star-document-ux.test.ts --maxWorkers=1 --fileParallelism=false || {
            echo "::warning title=north-star-document-ux::North Star 문서 UX 묶음 실패 — 비차단(PR-20 후속 UI PR 에서 차단으로 전환)"
            exit 1
          }
      # Browser suites create isolated Next builds; serialize them to avoid
      # shared .next contention on the single GitHub runner.
      - run: npm test -- --maxWorkers=1 --fileParallelism=false --exclude tests/north-star-document-ux.test.ts --exclude tests/share-recipient-portal-browser.test.ts
      # 연차 도구 테스트는 .mts(node --experimental-strip-types)라 vitest include(tests/**/*.test.ts)에 잡히지 않는다.
      - run: npm run leave:test
