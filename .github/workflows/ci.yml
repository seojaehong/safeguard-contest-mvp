name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # package-lock.json은 .gitignore 대상이라 npm ci/cache 사용 불가
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      # Browser suites create isolated Next builds; serialize them to avoid
      # shared .next contention on the single GitHub runner.
      - run: npm test -- --maxWorkers=1 --fileParallelism=false
      - run: npm run build
