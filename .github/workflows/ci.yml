name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      # package-lock.json은 .gitignore 대상이라 npm ci/cache 사용 불가
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      # Browser suites create isolated Next builds; serialize them to avoid
      # shared .next contention on the single GitHub runner.
      - run: npm test -- --maxWorkers=1 --fileParallelism=false
      - run: npm run build
