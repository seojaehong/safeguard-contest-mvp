name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # package-lock.json은 .gitignore 대상이라 npm ci/cache 사용 불가
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
